<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 체험 제품</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎁</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f4f6f5; --card: #ffffff; --text: #17201d; --muted: #6b7570; --line: #e1e6e3;
    --accent: #1f6b55; --accent-weak: #e8f2ee; --danger: #d64545; --warn: #8a6100; --warn-weak: #fdf3d6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 40px 16px 56px; }
  .head { text-align: center; margin-bottom: 24px; }
  .eyebrow { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--accent); background: var(--accent-weak); padding: 5px 10px; border-radius: 999px; margin-bottom: 12px; }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 8px; }
  .sub { color: var(--muted); font-size: 15px; margin: 0; line-height: 1.5; }
  .tabs { display: flex; background: #e6ebe8; border-radius: 14px; padding: 4px; margin-bottom: 16px; }
  .tabs button { flex: 1; border: 0; background: none; padding: 11px; font: inherit; font-size: 15px; font-weight: 600; color: var(--muted); border-radius: 11px; cursor: pointer; transition: .15s; }
  .tabs button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(23,32,29,.1); }
  .card { background: var(--card); border-radius: 18px; padding: 24px 20px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(23,32,29,.04), 0 4px 16px rgba(23,32,29,.04); }
  .card-title { font-size: 16px; font-weight: 700; margin: 0 0 4px; }
  label.f { display: block; font-size: 14px; font-weight: 600; margin: 20px 0 8px; }
  label.f:first-child { margin-top: 0; }
  .req { color: var(--danger); }
  input[type=text], input[type=date] { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; font: inherit; font-size: 16px; color: var(--text); background: #fbfcfb; transition: border-color .15s, box-shadow .15s, background .15s; }
  input[type=text]:focus, input[type=date]:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px var(--accent-weak); }
  .hint { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  .btn { display: block; width: 100%; padding: 15px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-size: 16px; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer; margin-top: 24px; transition: filter .15s; }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: var(--card); color: var(--text); border: 1px solid var(--line); margin-top: 10px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .msg { font-size: 14px; margin-top: 12px; min-height: 18px; text-align: center; line-height: 1.5; }
  .msg.err { color: var(--danger); }
  .msg.ok { color: var(--accent); font-weight: 600; }
  .notice { text-align: center; padding: 24px 8px; }
  .notice .icon { font-size: 40px; }
  .notice h2 { font-size: 18px; margin: 12px 0 6px; }
  .notice p { color: var(--muted); font-size: 14px; margin: 0; line-height: 1.5; }

  /* 상품 선택 */
  .options { display: flex; flex-direction: column; gap: 8px; }
  .options input { display: none; }
  .options label { display: flex; align-items: center; gap: 12px; padding: 15px 16px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; transition: .15s; }
  .options label::before { content: ''; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #c4ccc8; flex: none; box-sizing: border-box; transition: .15s; }
  .options input:checked + label { border-color: var(--accent); background: var(--accent-weak); }
  .options input:checked + label::before { border: 5px solid var(--accent); }
  .opt-name { font-size: 15px; font-weight: 600; }
  .opt-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .opt-sub.full { color: var(--warn); }

  /* 내 신청 내역 */
  .app { border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 12px; }
  .app-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .app-name { font-size: 16px; font-weight: 700; }
  .badge { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
  .badge.ok { color: var(--accent); background: var(--accent-weak); }
  .badge.wait { color: var(--warn); background: var(--warn-weak); }
  .steps { margin-top: 12px; border-top: 1px solid var(--line); }
  .step { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0 0; }
  .step-label { font-size: 14px; font-weight: 600; }
  .step-state { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .step-state.done { color: var(--accent); font-weight: 600; }
  .step button { border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 9px 14px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .step button.again { background: var(--card); color: var(--muted); border: 1px solid var(--line); font-weight: 600; }
  .btn.buy { margin-top: 12px; padding: 12px; font-size: 15px; }
  .wait-text { font-size: 13px; color: var(--muted); margin-top: 10px; line-height: 1.5; }

  /* 업로드 */
  .tag { text-align: center; margin-bottom: 14px; }
  .tag b { display: block; font-size: 18px; }
  .tag span { font-size: 14px; color: var(--accent); font-weight: 700; }
  .drop { display: block; border: 1.5px dashed #c4ccc8; border-radius: 14px; padding: 24px 12px; text-align: center; cursor: pointer; background: #fbfcfb; transition: .15s; }
  .drop.over { border-color: var(--accent); background: var(--accent-weak); }
  .drop.full { opacity: .5; cursor: default; }
  .drop .big { font-size: 28px; line-height: 1; }
  .drop .t { font-size: 15px; font-weight: 600; margin-top: 8px; }
  .drop .s { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .drop input { display: none; }
  .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .thumb { position: relative; aspect-ratio: 1; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; display: block; }
  .thumb .x { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; background: var(--text); color: #fff; font-size: 12px; line-height: 22px; cursor: pointer; }
  .thumb.loading { background: #edf1ef; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); }
  /* 신청 결과 */
  .result { position: relative; overflow: hidden; text-align: center; padding: 36px 20px 24px; }
  .result.win { background: linear-gradient(180deg, #e3f3ec 0%, #ffffff 62%); }
  .r-icon { font-size: 52px; line-height: 1; }
  .result.win .r-icon { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) both; }
  .r-title { font-size: 34px; font-weight: 800; letter-spacing: -.02em; margin-top: 10px; }
  .result.win .r-title { color: var(--accent); }
  .result.wait .r-title { font-size: 24px; color: var(--warn); }
  .r-product { display: inline-block; margin-top: 12px; padding: 6px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 15px; font-weight: 700; }
  .r-text { color: var(--muted); font-size: 15px; line-height: 1.6; margin: 14px 0 0; }
  .confetti { display: none; }
  .result.win .confetti { display: block; position: absolute; inset: 0; pointer-events: none; }
  .confetti i { position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px; opacity: 0; animation: fall 1.8s ease-out forwards; }
  .confetti i:nth-child(1) { left: 8%;  background: #1f6b55; animation-delay: .05s; }
  .confetti i:nth-child(2) { left: 20%; background: #f2b01e; animation-delay: .25s; }
  .confetti i:nth-child(3) { left: 33%; background: #e5677d; animation-delay: .1s; }
  .confetti i:nth-child(4) { left: 46%; background: #4a90d9; animation-delay: .35s; }
  .confetti i:nth-child(5) { left: 58%; background: #1f6b55; animation-delay: .15s; }
  .confetti i:nth-child(6) { left: 70%; background: #f2b01e; animation-delay: .3s; }
  .confetti i:nth-child(7) { left: 82%; background: #e5677d; animation-delay: .2s; }
  .confetti i:nth-child(8) { left: 92%; background: #4a90d9; animation-delay: .4s; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes fall { 0% { opacity: 1; transform: translateY(0) rotate(0); } 100% { opacity: 0; transform: translateY(260px) rotate(320deg); } }
  @media (prefers-reduced-motion: reduce) { .result.win .r-icon, .confetti i { animation: none; } }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="eyebrow">PHARMABROS</div>
    <h1>오늘의 체험 제품은?</h1>
    <p class="sub">궁금했던 제품, 직접 경험하고 솔직한 후기를 남겨주세요.</p>
  </header>

  <div class="tabs">
    <button type="button" id="tabApply" class="on" onclick="showTab('apply')">제품 신청</button>
    <button type="button" id="tabSubmit" onclick="showTab('submit')">체험 인증</button>
  </div>

  <!-- 신청 -->
  <section id="applyView">
    <div class="card" id="applyClosed">
      <div class="notice"><div class="icon">⏳</div><h2 id="closedTitle">불러오는 중...</h2><p id="closedText"></p></div>
    </div>
    <div class="card hidden" id="applyForm">
      <label class="f">신청할 상품 <span class="req">*</span></label>
      <div class="options" id="productOptions"></div>
      <label class="f">이름 (실명) <span class="req">*</span></label>
      <input type="text" id="applyName" autocomplete="name">
      <div class="hint">선착순 안에 들면 바로 <b>당첨</b>! 마감 후 신청은 대기로 접수되고, 자리가 나면 순서대로 자동 당첨돼요.</div>
      <button class="btn" type="button" id="applyBtn" onclick="submitApply()">신청하기</button>
      <div class="msg" id="applyMsg"></div>
    </div>

    <!-- 신청 결과: 당첨 / 대기 -->
    <div class="card result hidden" id="resultCard">
      <div class="confetti" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="r-icon" id="rIcon">🎉</div>
      <div class="r-title" id="rTitle">당첨!</div>
      <div class="r-product" id="rProduct"></div>
      <p class="r-text" id="rText"></p>
      <div id="rBuyWrap">
        <a class="btn" id="buyBtn" href="#" target="_blank" rel="noopener">🛒 지금 구매하러 가기</a>
        <div class="hint" style="text-align:center">구매 후 <b>체험 인증</b> 탭에서 구매 인증과 리뷰 인증을 해주세요.</div>
      </div>
      <button class="btn ghost hidden" type="button" id="rAgain" onclick="backToApply()">다른 상품 신청하기</button>
    </div>
  </section>

  <!-- 제출 -->
  <section id="submitView" class="hidden">
    <div class="card" id="whoCard">
      <label class="f">이름 (실명) <span class="req">*</span></label>
      <input type="text" id="whoName" autocomplete="name">
      <div class="hint">신청할 때 입력한 실명으로 조회해요.</div>
      <button class="btn" type="button" id="checkBtn" onclick="loadList()">내 신청 내역 보기</button>
      <div class="msg" id="checkMsg"></div>
    </div>

    <div class="card hidden" id="listCard">
      <div class="card-title">내 신청 내역</div>
      <div class="hint" style="margin-top:0">구매 인증과 리뷰 인증은 순서 상관없이 할 수 있어요.</div>
      <div id="appList"></div>
      <button class="btn ghost" type="button" onclick="backToWho()">다른 이름으로 조회</button>
    </div>

    <div class="hidden" id="uploadForm">
      <div class="card">
        <div class="tag"><b id="upProduct"></b><span id="upKind"></span></div>
        <div class="hint" id="upGuide" style="text-align:center;margin:0 0 20px"></div>
        <div id="buyDateWrap">
          <label class="f">구매일 <span class="req">*</span></label>
          <input type="date" id="buyDate">
        </div>
        <label class="f">이미지 <span class="req">*</span></label>
        <label class="drop" id="drop">
          <input type="file" id="files" accept="image/*" multiple>
          <div class="big">📷</div>
          <div class="t">이미지 추가 (<span id="fileCount">0</span>/3)</div>
          <div class="s">탭해서 촬영·앨범 선택 / PC는 끌어다 놓기</div>
        </label>
        <div class="thumbs" id="thumbs"></div>
        <button class="btn" type="button" id="uploadBtn" onclick="submitUpload()">인증하기</button>
        <button class="btn ghost" type="button" onclick="loadList()">목록으로</button>
        <div class="msg" id="uploadMsg"></div>
      </div>
    </div>
  </section>
</div>

<script>
  // Apps Script 웹 앱 배포 URL
  const API_URL = 'https://script.google.com/macros/s/AKfycbx858_nPeecvyNvWzOtk3nafQDAOecitgTd-gkgKdVJc5x3QRLHUs-Jye9bHGhuZ0E/exec';
  const MAX_FILES = 3;
  const KINDS = {
    receipt: { label: '구매 인증', guide: '주문 상세(결제 내역) 화면 캡처나 영수증 사진을 올려 주세요.' },
    review: { label: '리뷰 인증', guide: '스마트스토어에 작성한 내 리뷰가 보이도록 캡처해서 올려 주세요.' },
  };

  let target = null; // { product, kind }
  let fileData = [];
  let filesLoading = 0;

  // ---------- 공통 ----------
  const $ = function (id) { return document.getElementById(id); };

  function store(key, val) {
    try {
      if (val === undefined) return localStorage.getItem(key) || '';
      localStorage.setItem(key, val);
    } catch (e) { return ''; }
  }

  async function api(action, data) {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action: action }, data || {})) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '오류가 발생했어요.');
    return json;
  }

  function setMsg(id, text, ok) {
    $(id).textContent = text || '';
    $(id).className = 'msg ' + (ok ? 'ok' : 'err');
  }

  function busy(btn, on, label) {
    btn.disabled = on;
    if (label) btn.textContent = label;
  }

  function show(id, on) { $(id).classList.toggle('hidden', !on); }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function safeUrl(u) { return /^https?:\/\//.test(u) ? u : ''; }

  function showTab(tab) {
    $('tabApply').classList.toggle('on', tab === 'apply');
    $('tabSubmit').classList.toggle('on', tab === 'submit');
    show('applyView', tab === 'apply');
    show('submitView', tab === 'submit');
  }

  function rememberName(name) {
    store('erv_name', name);
    ['applyName', 'whoName'].forEach(function (id) { if (!$(id).value) $(id).value = name; });
  }

  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // ---------- 초기 로딩 ----------
  (function init() {
    $('applyName').value = $('whoName').value = store('erv_name');

    api('info').then(function (d) {
      if (!d.products.length) {
        $('closedTitle').textContent = '지금은 신청 중인 상품이 없어요';
        $('closedText').textContent = '이미 신청하셨다면 체험 인증 탭을 이용해 주세요.';
        return;
      }
      $('productOptions').innerHTML = d.products.map(function (p, i) {
        const sub = p.remaining == null ? '선착순 모집 중'
          : p.remaining > 0 ? '남은 자리 ' + p.remaining + '명' : '선착순 마감 · 대기 신청 가능';
        return '<input type="radio" name="product" id="p' + i + '" value="' + escapeHtml(p.name) + '"' + (d.products.length === 1 ? ' checked' : '') + '>' +
          '<label for="p' + i + '"><div><div class="opt-name">' + escapeHtml(p.name) + '</div>' +
          '<div class="opt-sub' + (p.remaining === 0 ? ' full' : '') + '">' + sub + '</div></div></label>';
      }).join('');
      openProducts = d.products.map(function (p) { return p.name; });
      show('applyClosed', false);
      show('applyForm', true);
    }).catch(function (e) {
      $('closedTitle').textContent = '페이지를 불러오지 못했어요';
      $('closedText').textContent = e.message;
    });
  })();

  // ---------- 신청 ----------
  let openProducts = [];

  async function submitApply() {
    const picked = document.querySelector('input[name=product]:checked');
    const name = $('applyName').value.trim();
    if (!picked) return setMsg('applyMsg', '신청할 상품을 선택해 주세요.');
    if (!name) return setMsg('applyMsg', '이름(실명)을 입력해 주세요.');
    const btn = $('applyBtn');
    busy(btn, true, '신청 중...');
    setMsg('applyMsg', '');
    try {
      const d = await api('apply', { product: picked.value, name: name });
      rememberName(name);
      showResult(picked.value, d.status, d.link);
    } catch (e) {
      setMsg('applyMsg', e.message);
    }
    busy(btn, false, '신청하기');
  }

  /** 신청 폼 대신 결과 화면: 당첨이면 축하 + 구매 버튼, 대기면 안내 */
  function showResult(product, status, link) {
    const win = status === '신청완료';
    const card = $('resultCard');
    card.classList.remove('win', 'wait');
    void card.offsetWidth; // 애니메이션 다시 재생
    card.classList.add(win ? 'win' : 'wait');
    $('rIcon').textContent = win ? '🎉' : '⏳';
    $('rTitle').textContent = win ? '당첨!' : '대기 접수';
    $('rProduct').textContent = product;
    $('rText').innerHTML = win
      ? '축하해요! 선착순 안에 들었어요.<br>아래 버튼으로 바로 구매해 주세요.'
      : '선착순이 마감되어 대기로 접수됐어요.<br>자리가 나면 신청 순서대로 자동 당첨돼요.';
    const url = safeUrl(link || '');
    if (url) $('buyBtn').href = url;
    show('rBuyWrap', win && !!url);
    show('rAgain', openProducts.length > 1);
    show('applyForm', false);
    show('resultCard', true);
    window.scrollTo(0, 0);
  }

  function backToApply() {
    setMsg('applyMsg', '');
    show('resultCard', false);
    show('applyForm', true);
  }

  // ---------- 내 신청 내역 ----------
  let items = [];

  async function loadList() {
    const name = $('whoName').value.trim();
    if (!name) return setMsg('checkMsg', '이름(실명)을 입력해 주세요.');
    const btn = $('checkBtn');
    busy(btn, true, '조회 중...');
    setMsg('checkMsg', '');
    try {
      const d = await api('status', { name: name });
      rememberName(name);
      items = d.items;
      renderList();
      ['whoCard', 'uploadForm'].forEach(function (id) { show(id, false); });
      show('listCard', true);
      window.scrollTo(0, 0);
    } catch (e) {
      setMsg('checkMsg', e.message);
      ['listCard', 'uploadForm'].forEach(function (id) { show(id, false); });
      show('whoCard', true);
    }
    busy(btn, false, '내 신청 내역 보기');
  }

  function renderList() {
    if (!items.length) {
      $('appList').innerHTML = '<div class="notice"><div class="icon">🔍</div><h2>신청 내역이 없어요</h2>' +
        '<p>신청할 때 입력한 실명과 같은지 확인해 주세요.</p></div>';
      return;
    }
    $('appList').innerHTML = items.map(function (it, i) {
      const ok = it.status === '신청완료';
      let html = '<div class="app"><div class="app-top"><div class="app-name">' + escapeHtml(it.product) + '</div>' +
        '<span class="badge ' + (ok ? 'ok' : 'wait') + '">' + (ok ? '당첨' : escapeHtml(it.status)) + '</span></div>';
      const link = safeUrl(it.link || '');
      if (ok && link) html += '<a class="btn buy" href="' + escapeHtml(link) + '" target="_blank" rel="noopener">🛒 구매하러 가기</a>';
      if (ok) {
        html += '<div class="steps">' +
          step(i, 'receipt', it.receipt, it.receipt ? '인증 완료' + (it.buyDate ? ' · 구매일 ' + escapeHtml(it.buyDate) : '') : '아직 인증 전') +
          step(i, 'review', it.review, it.review ? '인증 완료' : '아직 인증 전') +
          '</div>';
      } else {
        html += '<div class="wait-text">선착순이 마감되어 대기 중이에요. 자리가 나면 신청 순서대로 자동 당첨돼요.</div>';
      }
      return html + '</div>';
    }).join('');
    $('appList').querySelectorAll('button[data-i]').forEach(function (b) {
      b.onclick = function () { openUpload(items[Number(b.dataset.i)].product, b.dataset.kind); };
    });
  }

  function step(i, kind, done, state) {
    return '<div class="step"><div><div class="step-label">' + (done ? '✅ ' : '') + KINDS[kind].label + '</div>' +
      '<div class="step-state' + (done ? ' done' : '') + '">' + state + '</div></div>' +
      '<button type="button" class="' + (done ? 'again' : '') + '" data-i="' + i + '" data-kind="' + kind + '">' +
      (done ? '다시 올리기' : '인증하기') + '</button></div>';
  }

  function backToWho() {
    show('listCard', false);
    show('whoCard', true);
  }

  // ---------- 업로드 ----------
  function openUpload(product, kind) {
    target = { product: product, kind: kind };
    $('upProduct').textContent = product;
    $('upKind').textContent = KINDS[kind].label;
    $('upGuide').textContent = KINDS[kind].guide;
    show('buyDateWrap', kind === 'receipt');
    if (kind === 'receipt' && !$('buyDate').value) $('buyDate').value = today();
    fileData = [];
    renderThumbs();
    setMsg('uploadMsg', '');
    busy($('uploadBtn'), false, '인증하기');
    show('listCard', false);
    show('uploadForm', true);
    window.scrollTo(0, 0);
  }

  const drop = $('drop');
  $('files').addEventListener('change', function (e) {
    addFiles(e.target.files);
    e.target.value = ''; // 같은 파일 다시 선택 가능하도록
  });
  ['dragenter', 'dragover'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function (e) { addFiles(e.dataTransfer.files); });
  drop.addEventListener('click', function (e) {
    if (fileData.length + filesLoading >= MAX_FILES) {
      e.preventDefault();
      setMsg('uploadMsg', '이미지는 최대 ' + MAX_FILES + '장이에요. 기존 이미지를 지우고 추가해 주세요.');
    }
  });

  async function addFiles(fileList) {
    setMsg('uploadMsg', '');
    const images = Array.from(fileList).filter(function (f) { return f.type.indexOf('image/') === 0; });
    const room = Math.max(MAX_FILES - fileData.length - filesLoading, 0);
    if (images.length > room) setMsg('uploadMsg', '이미지는 최대 ' + MAX_FILES + '장이라 ' + room + '장만 추가했어요.');
    const files = images.slice(0, room);
    filesLoading += files.length;
    renderThumbs();
    for (const file of files) {
      try {
        fileData.push(await resizeImage(file));
      } catch (err) {
        setMsg('uploadMsg', '이미지를 읽을 수 없어요: ' + file.name);
      }
      filesLoading--;
      renderThumbs();
    }
  }

  function removeFile(i) {
    fileData.splice(i, 1);
    renderThumbs();
  }

  function renderThumbs() {
    $('thumbs').innerHTML = fileData.map(function (p, i) {
      return '<div class="thumb"><img src="data:image/jpeg;base64,' + p.data + '" alt="">' +
        '<button type="button" class="x" onclick="removeFile(' + i + ')">✕</button></div>';
    }).join('') + '<div class="thumb loading">처리 중</div>'.repeat(filesLoading);
    $('fileCount').textContent = fileData.length;
    drop.classList.toggle('full', fileData.length + filesLoading >= MAX_FILES);
  }

  // 캡처 글씨가 읽히도록 긴 변 2000px JPEG로 축소
  function resizeImage(file) {
    return new Promise(function (resolve, reject) {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = function () {
        const r = Math.min(1, 2000 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * r);
        c.height = Math.round(img.height * r);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve({ data: c.toDataURL('image/jpeg', 0.88).split(',')[1] });
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  async function submitUpload() {
    if (!fileData.length) return setMsg('uploadMsg', '이미지를 1장 이상 올려 주세요.');
    if (filesLoading) return setMsg('uploadMsg', '이미지를 처리하는 중이에요. 잠시 후 다시 눌러 주세요.');
    const buyDate = $('buyDate').value;
    if (target.kind === 'receipt' && !buyDate) return setMsg('uploadMsg', '구매일을 선택해 주세요.');

    const btn = $('uploadBtn');
    busy(btn, true, '업로드 중... (' + fileData.length + '장)');
    setMsg('uploadMsg', '');
    try {
      await api('submit', {
        name: $('whoName').value.trim(),
        product: target.product,
        kind: target.kind,
        buyDate: target.kind === 'receipt' ? buyDate : '',
        files: fileData,
      });
      await loadList();
    } catch (e) {
      setMsg('uploadMsg', e.message);
      busy(btn, false, '인증하기');
    }
  }
</script>
</body>
</html>
