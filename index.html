<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>임직원 제품 체험</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f4f6f5; --card: #ffffff; --text: #17201d; --muted: #6b7570; --line: #e1e6e3;
    --accent: #1f6b55; --accent-weak: #e8f2ee; --danger: #d64545; --ok: #1f6b55; --star: #f2b01e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 40px 16px 56px; }
  .head { text-align: center; margin-bottom: 24px; }
  .eyebrow { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--accent); background: var(--accent-weak); padding: 5px 10px; border-radius: 999px; margin-bottom: 12px; }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 8px; }
  .sub { color: var(--muted); font-size: 15px; margin: 0; line-height: 1.5; }
  .tabs { display: flex; background: #e6ebe8; border-radius: 14px; padding: 4px; margin-bottom: 16px; }
  .tabs button { flex: 1; border: 0; background: none; padding: 11px; font: inherit; font-size: 15px; font-weight: 600; color: var(--muted); border-radius: 11px; cursor: pointer; transition: .15s; }
  .tabs button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(23,32,29,.1); }
  .card { background: var(--card); border-radius: 18px; padding: 24px 20px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(23,32,29,.04), 0 4px 16px rgba(23,32,29,.04); }
  .card-title { font-size: 16px; font-weight: 700; margin: 0 0 8px; }
  label.f { display: block; font-size: 14px; font-weight: 600; margin: 20px 0 8px; }
  label.f:first-child { margin-top: 0; }
  .req { color: var(--danger); }
  input[type=text], textarea { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; font: inherit; font-size: 16px; color: var(--text); background: #fbfcfb; transition: border-color .15s, box-shadow .15s, background .15s; }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px var(--accent-weak); }
  textarea { min-height: 170px; resize: vertical; line-height: 1.6; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  .btn { width: 100%; padding: 15px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 24px; transition: filter .15s; }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: var(--card); color: var(--text); border: 1px solid var(--line); margin-top: 10px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .msg { font-size: 14px; margin-top: 12px; min-height: 18px; text-align: center; }
  .msg.err { color: var(--danger); }
  .msg.ok { color: var(--ok); font-weight: 600; }
  .notice { text-align: center; padding: 24px 8px; }
  .notice .icon { font-size: 40px; }
  .notice h2 { font-size: 18px; margin: 12px 0 6px; }
  .notice p { color: var(--muted); font-size: 14px; margin: 0; line-height: 1.5; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .options input { display: none; }
  .options label { display: flex; align-items: center; gap: 10px; padding: 15px 16px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: .15s; }
  .options label::before { content: ''; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #c4ccc8; flex: none; box-sizing: border-box; transition: .15s; }
  .options input:checked + label { border-color: var(--accent); background: var(--accent-weak); }
  .options input:checked + label::before { border: 5px solid var(--accent); }
  .item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .nm { font-size: 15px; font-weight: 600; }
  .item .st { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .item button { border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 10px 14px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .tag { display: block; text-align: center; color: var(--accent); font-size: 15px; font-weight: 700; margin-bottom: 14px; }
  .stars { display: inline-flex; flex-direction: row-reverse; }
  .stars input { display: none; }
  .stars label { font-size: 36px; color: #dde3e0; cursor: pointer; padding: 0 2px; line-height: 1; transition: color .1s; }
  .stars input:checked ~ label, .stars label:hover, .stars label:hover ~ label { color: var(--star); }
  .count { float: right; font-weight: 400; color: var(--muted); font-size: 12px; }
  .drop { display: block; border: 1.5px dashed #c4ccc8; border-radius: 14px; padding: 24px 12px; text-align: center; cursor: pointer; background: #fbfcfb; transition: .15s; }
  .drop.over { border-color: var(--accent); background: var(--accent-weak); }
  .drop.full { opacity: .5; cursor: default; }
  .drop .big { font-size: 28px; line-height: 1; }
  .drop .t { font-size: 15px; font-weight: 600; margin-top: 8px; }
  .drop .s { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .drop input { display: none; }
  .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .thumb { position: relative; aspect-ratio: 1; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; display: block; }
  .thumb .x { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; background: var(--text); color: #fff; font-size: 12px; line-height: 22px; cursor: pointer; }
  .thumb.loading { background: #edf1ef; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="eyebrow">PHARMABROS</div>
    <h1>임직원 제품 체험</h1>
    <p class="sub">제품을 신청하고, 받은 뒤 사용 후기를 남겨 주세요.</p>
  </header>

  <div class="tabs">
    <button type="button" id="tabApply" class="on" onclick="showTab('apply')">제품 신청</button>
    <button type="button" id="tabReview" onclick="showTab('review')">리뷰 작성</button>
  </div>

  <!-- 신청 -->
  <section id="applyView">
    <div class="card" id="applyClosed">
      <div class="notice"><div class="icon">⏳</div><h2 id="closedTitle">불러오는 중...</h2><p id="closedText"></p></div>
    </div>
    <div class="card hidden" id="applyForm">
      <label class="f">신청할 상품 <span class="req">*</span></label>
      <div class="options" id="productOptions"></div>
      <label class="f">이름 <span class="req">*</span></label>
      <input type="text" id="applyName" autocomplete="name">
      <label class="f">쇼핑몰 ID <span class="req">*</span></label>
      <input type="text" id="applyUserId" autocapitalize="off" autocomplete="username">
      <div class="hint">리뷰 작성자로 표시되는 정보예요. 리뷰 작성할 때도 같은 이름과 ID로 조회해요.</div>
      <button class="btn" type="button" id="applyBtn" onclick="submitApply()">신청하기</button>
      <div class="msg" id="applyMsg"></div>
    </div>
  </section>

  <!-- 리뷰 -->
  <section id="reviewView" class="hidden">
    <div class="card" id="whoCard">
      <label class="f">이름 <span class="req">*</span></label>
      <input type="text" id="revName" autocomplete="name">
      <label class="f">쇼핑몰 ID <span class="req">*</span></label>
      <input type="text" id="revUserId" autocapitalize="off" autocomplete="username">
      <button class="btn" type="button" id="checkBtn" onclick="loadList()">내 신청 내역 보기</button>
      <div class="msg" id="checkMsg"></div>
    </div>

    <div class="card hidden" id="listCard">
      <div class="card-title">내 신청 내역</div>
      <div id="appList"></div>
      <button class="btn ghost" type="button" onclick="backToWho()">다른 이름으로 조회</button>
    </div>

    <div class="card hidden" id="doneCard">
      <div class="notice"><div class="icon">🙌</div><h2>리뷰 제출 완료!</h2><p>소중한 후기 감사합니다.</p></div>
      <button class="btn ghost" type="button" onclick="loadList()">내 신청 내역으로</button>
    </div>

    <div class="hidden" id="reviewForm">
      <div class="tag" id="reviewProduct"></div>
      <div class="card">
        <label class="f">별점 <span class="req">*</span></label>
        <div class="stars" id="score"></div>
        <label class="f">리뷰 내용 <span class="req">*</span> <span class="count" id="msgCount">0자</span></label>
        <textarea id="message" placeholder="제품을 사용해 본 솔직한 후기를 적어 주세요 (20자 이상)"></textarea>
      </div>
      <div class="card">
        <label class="f">사진 (선택)</label>
        <label class="drop" id="drop">
          <input type="file" id="photos" accept="image/*" multiple>
          <div class="big">📷</div>
          <div class="t">사진 추가 (<span id="photoCount">0</span>/4)</div>
          <div class="s">탭해서 촬영·앨범 선택 / PC는 끌어다 놓기</div>
        </label>
        <div class="thumbs" id="thumbs"></div>
      </div>
      <button class="btn" type="button" id="reviewBtn" onclick="submitReview()">리뷰 제출</button>
      <button class="btn ghost" type="button" onclick="loadList()">목록으로</button>
      <div class="msg" id="reviewMsg"></div>
    </div>
  </section>
</div>

<script>
  // Apps Script 웹 앱 배포 URL
  const API_URL = 'https://script.google.com/macros/s/AKfycbx858_nPeecvyNvWzOtk3nafQDAOecitgTd-gkgKdVJc5x3QRLHUs-Jye9bHGhuZ0E/exec';
  const MAX_PHOTOS = 4;
  const MIN_MESSAGE = 20;

  let reviewTarget = '';
  let photoData = [];
  let photosLoading = 0;

  // ---------- 공통 ----------
  const $ = function (id) { return document.getElementById(id); };

  function store(key, val) {
    try {
      if (val === undefined) return localStorage.getItem(key) || '';
      localStorage.setItem(key, val);
    } catch (e) { return ''; }
  }

  async function api(action, data) {
    const body = Object.assign({ action: action }, data || {});
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '오류가 발생했어요.');
    return json;
  }

  function setMsg(id, text, ok) {
    $(id).textContent = text || '';
    $(id).className = 'msg ' + (ok ? 'ok' : 'err');
  }

  function busy(btn, on, label) {
    btn.disabled = on;
    if (label) btn.textContent = label;
  }

  function show(id, on) { $(id).classList.toggle('hidden', !on); }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function showTab(tab) {
    $('tabApply').classList.toggle('on', tab === 'apply');
    $('tabReview').classList.toggle('on', tab === 'review');
    show('applyView', tab === 'apply');
    show('reviewView', tab === 'review');
  }

  function rememberWho(name, userId) {
    store('erv_name', name);
    store('erv_uid', userId);
    ['applyName', 'revName'].forEach(function (id) { if (!$(id).value) $(id).value = name; });
    ['applyUserId', 'revUserId'].forEach(function (id) { if (!$(id).value) $(id).value = userId; });
  }

  // ---------- 초기 로딩 ----------
  (function init() {
    $('applyName').value = $('revName').value = store('erv_name');
    $('applyUserId').value = $('revUserId').value = store('erv_uid');

    for (let v = 5; v >= 1; v--) {
      $('score').insertAdjacentHTML('beforeend',
        '<input type="radio" id="s' + v + '" name="score" value="' + v + '"' + (v === 5 ? ' checked' : '') + '>' +
        '<label for="s' + v + '">★</label>');
    }
    $('message').addEventListener('input', function () { $('msgCount').textContent = this.value.trim().length + '자'; });

    api('info').then(function (d) {
      if (!d.products.length) {
        $('closedTitle').textContent = '지금은 신청 중인 상품이 없어요';
        $('closedText').textContent = '제품을 이미 받으셨다면 리뷰 작성 탭을 이용해 주세요.';
        return;
      }
      $('productOptions').innerHTML = d.products.map(function (p, i) {
        return '<input type="radio" name="product" id="p' + i + '" value="' + escapeHtml(p) + '"' + (d.products.length === 1 ? ' checked' : '') + '>' +
          '<label for="p' + i + '">' + escapeHtml(p) + '</label>';
      }).join('');
      show('applyClosed', false);
      show('applyForm', true);
    }).catch(function (e) {
      $('closedTitle').textContent = '페이지를 불러오지 못했어요';
      $('closedText').textContent = e.message;
    });
  })();

  // ---------- 신청 ----------
  async function submitApply() {
    const picked = document.querySelector('input[name=product]:checked');
    const name = $('applyName').value.trim();
    const userId = $('applyUserId').value.trim();
    if (!picked) return setMsg('applyMsg', '신청할 상품을 선택해 주세요.');
    if (!name || !userId) return setMsg('applyMsg', '이름과 쇼핑몰 ID를 입력해 주세요.');
    const btn = $('applyBtn');
    busy(btn, true, '신청 중...');
    setMsg('applyMsg', '');
    try {
      const d = await api('apply', { product: picked.value, name: name, userId: userId });
      rememberWho(name, userId);
      setMsg('applyMsg', d.message, true);
    } catch (e) {
      setMsg('applyMsg', e.message);
    }
    busy(btn, false, '신청하기');
  }

  // ---------- 리뷰: 내 신청 내역 ----------
  const STATUS_TEXT = {
    '신청': '제품 지급 전이에요',
    '지급완료': '제품을 받으셨어요. 리뷰를 남겨 주세요!',
    '리뷰완료': '리뷰 작성 완료',
  };

  async function loadList() {
    const name = $('revName').value.trim();
    const userId = $('revUserId').value.trim();
    if (!name || !userId) return setMsg('checkMsg', '이름과 쇼핑몰 ID를 입력해 주세요.');
    const btn = $('checkBtn');
    busy(btn, true, '조회 중...');
    setMsg('checkMsg', '');
    try {
      const d = await api('status', { name: name, userId: userId });
      rememberWho(name, userId);
      $('appList').innerHTML = d.items.length ? d.items.map(function (it, i) {
        return '<div class="item"><div><div class="nm">' + escapeHtml(it.product) + '</div>' +
          '<div class="st">' + escapeHtml(STATUS_TEXT[it.status] || it.status) + '</div></div>' +
          (it.status === '지급완료' ? '<button type="button" data-i="' + i + '">리뷰 쓰기</button>' : '') + '</div>';
      }).join('') : '<div class="notice"><div class="icon">🔍</div><h2>신청 내역이 없어요</h2>' +
        '<p>이름과 쇼핑몰 ID를 신청할 때와 똑같이 입력했는지 확인해 주세요.</p></div>';
      $('appList').querySelectorAll('button[data-i]').forEach(function (b) {
        b.onclick = function () { openReview(d.items[Number(b.dataset.i)].product); };
      });
      ['whoCard', 'doneCard', 'reviewForm'].forEach(function (id) { show(id, false); });
      show('listCard', true);
    } catch (e) {
      setMsg('checkMsg', e.message);
      ['listCard', 'doneCard', 'reviewForm'].forEach(function (id) { show(id, false); });
      show('whoCard', true);
    }
    busy(btn, false, '내 신청 내역 보기');
  }

  function backToWho() {
    show('listCard', false);
    show('whoCard', true);
  }

  function openReview(product) {
    reviewTarget = product;
    $('reviewProduct').textContent = product;
    $('message').value = '';
    $('msgCount').textContent = '0자';
    $('s5').checked = true;
    photoData = [];
    renderThumbs();
    setMsg('reviewMsg', '');
    busy($('reviewBtn'), false, '리뷰 제출');
    show('listCard', false);
    show('reviewForm', true);
    window.scrollTo(0, 0);
  }

  // ---------- 리뷰: 사진 ----------
  const drop = $('drop');
  $('photos').addEventListener('change', function (e) {
    addPhotos(e.target.files);
    e.target.value = ''; // 같은 사진 다시 선택 가능하도록
  });
  ['dragenter', 'dragover'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function (e) { addPhotos(e.dataTransfer.files); });
  drop.addEventListener('click', function (e) {
    if (photoData.length + photosLoading >= MAX_PHOTOS) {
      e.preventDefault();
      setMsg('reviewMsg', '사진은 최대 ' + MAX_PHOTOS + '장이에요. 기존 사진을 지우고 추가해 주세요.');
    }
  });

  async function addPhotos(fileList) {
    setMsg('reviewMsg', '');
    const images = Array.from(fileList).filter(function (f) { return f.type.indexOf('image/') === 0; });
    const room = Math.max(MAX_PHOTOS - photoData.length - photosLoading, 0);
    if (images.length > room) setMsg('reviewMsg', '사진은 최대 ' + MAX_PHOTOS + '장이라 ' + room + '장만 추가했어요.');
    const files = images.slice(0, room);
    photosLoading += files.length;
    renderThumbs();
    for (const file of files) {
      try {
        photoData.push(await resizeImage(file));
      } catch (err) {
        setMsg('reviewMsg', '사진을 읽을 수 없어요: ' + file.name);
      }
      photosLoading--;
      renderThumbs();
    }
  }

  function removePhoto(i) {
    photoData.splice(i, 1);
    renderThumbs();
  }

  function renderThumbs() {
    $('thumbs').innerHTML = photoData.map(function (p, i) {
      return '<div class="thumb"><img src="data:image/jpeg;base64,' + p.data + '" alt="">' +
        '<button type="button" class="x" onclick="removePhoto(' + i + ')">✕</button></div>';
    }).join('') + '<div class="thumb loading">처리 중</div>'.repeat(photosLoading);
    $('photoCount').textContent = photoData.length;
    drop.classList.toggle('full', photoData.length + photosLoading >= MAX_PHOTOS);
  }

  // 업로드 용량을 줄이기 위해 긴 변 1280px JPEG로 축소
  function resizeImage(file) {
    return new Promise(function (resolve, reject) {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = function () {
        const r = Math.min(1, 1280 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * r);
        c.height = Math.round(img.height * r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve({ data: c.toDataURL('image/jpeg', 0.85).split(',')[1] });
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  // ---------- 리뷰: 제출 ----------
  async function submitReview() {
    const message = $('message').value.trim();
    const scoreEl = document.querySelector('input[name=score]:checked');
    if (!scoreEl) return setMsg('reviewMsg', '별점을 선택해 주세요.');
    if (message.length < MIN_MESSAGE) return setMsg('reviewMsg', '리뷰 내용을 ' + MIN_MESSAGE + '자 이상 적어 주세요.');
    if (photosLoading) return setMsg('reviewMsg', '사진을 처리하는 중이에요. 잠시 후 다시 눌러 주세요.');

    const btn = $('reviewBtn');
    busy(btn, true, photoData.length ? '사진 업로드 중... (' + photoData.length + '장)' : '제출 중...');
    setMsg('reviewMsg', '');
    try {
      await api('review', {
        product: reviewTarget,
        name: $('revName').value.trim(),
        userId: $('revUserId').value.trim(),
        score: Number(scoreEl.value),
        message: message,
        photos: photoData,
      });
      show('reviewForm', false);
      show('doneCard', true);
      window.scrollTo(0, 0);
    } catch (e) {
      setMsg('reviewMsg', e.message);
      busy(btn, false, '리뷰 제출');
    }
  }
</script>
</body>
</html>
